spring:
  datasource:
    url: jdbc:h2:mem:suretyseven;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true

# Uses application.yml's default spring.kafka.bootstrap-servers (localhost:9094)
# and PLAINTEXT security protocol -- matching the docker-compose Kafka
# container's host-mapped port. Running with `mvn spring-boot:run` directly
# (rather than `docker compose up`) still needs SOME Kafka broker reachable
# at that address for evaluation/notifications to actually flow; see
# README "Running it" for a one-line way to start just the Kafka container.

logging:
  level:
    com.suretyseven: DEBUG
